default_category: "연예·이슈"
daily_limit: 8
publish_mode: draft
# 글 작성 전 Smart Editor 모바일 미리보기 모드로 전환
mobile_preview: true
image_priority:
  - user
  - nvidia
  - card
nvidia_images_per_post: 3
nvidia_image_model: black-forest-labs/flux.1-schnell
image_planning:
  enabled: true
# 짧은 사용자 이미지 프롬프트 → NVIDIA Llama 3.1 8B로 FLUX용 영문 확장
image_prompt_expand:
  enabled: true
  model: meta/llama-3.1-8b-instruct
  min_length: 72
# Imagen/SNS 비활성 — NVIDIA FLUX.1-schnell 생성
sns:
  enabled: false
  max_candidates: 24
  per_query: 8
  min_width: 400
  min_height: 300
  search_queries:
    - "{keyword}"
    - "{keyword} 맛집"
    - "{keyword} site:instagram.com"
    - "{keyword} site:pinterest.com"
  prefer_sources:
    - instagram
    - pinterest
    - naver_blog
    - naver_post
    - web
require_disclaimer_if:
  - defamation
  - unverified_claim

# AI 생성(nvidia FLUX) 이미지 후처리 — user/card 는 제외
image_postprocess:
  enabled: true
  apply_to:
    - nvidia
  strip_exif: true
  watermark:
    enabled: true
    text: "© {blog_id}"   # NAVER_BLOG_ID 자동 치환
    position: bottom_right  # bottom_right | bottom_left | top_right | top_left | center | tile
    opacity: 0.35
    font_size: 26
    padding: 24
  transforms:
    crop_jitter: 0.025      # 슬롯별 미세 크롭 (프레임 차이)
    brightness_jitter: 0.04
    contrast: 1.04
    contrast_jitter: 0.03
    saturation: 1.06
    saturation_jitter: 0.04
    sharpness: 1.08
    rotate_deg: 0.4         # ±0.4° 미세 회전
    vignette: true
    vignette_strength: 0.12
  border:
    enabled: false
    width: 4
    color: "#ffffff"
