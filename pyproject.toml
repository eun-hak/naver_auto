[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naver-auto"
version = "0.1.0"
description = "키워드 기반 네이버 블로그 자동 생성 및 임시저장"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "openai>=1.0",
  "httpx>=0.27",
  "pillow>=10.0",
  "playwright>=1.40",
  "pyperclip>=1.8",
  "tenacity>=8.2",
  "google-generativeai>=0.8",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[project.scripts]
naver-auto = "naver_auto.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
